<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board Whiteboard</title>
  <style>
    :root {
      --bg: #faf9f7;
      --panel: #f0ede8;
      --panel-2: #e8e3dc;
      --text: #111009;
      --muted: #4a3d37;
      --border: #c8c0b8;
      --accent: #7a3410;

      --epic: #c2560a;
      --feature: #7c3aed;
      --story: #1d4ed8;
      --task: #4a3d37;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .right {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #f5f3f0, #faf9f7);
    }

    .toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(240, 237, 232, 0.95);
      backdrop-filter: blur(5px);
    }

    .tool-btn {
      border: 1px solid var(--border);
      background: #f0ede8;
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .tool-btn:hover { border-color: var(--accent); }

    .tool-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .view-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      user-select: none;
    }

    .view-toggle input {
      accent-color: #7a3410;
      cursor: pointer;
    }

    .timeline-overlay {
      position: absolute;
      inset: 0;
      z-index: 22;
      pointer-events: none;
    }

    .timeline-axis {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(240, 237, 232, 0.95);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      cursor: crosshair;
    }

    .time-axis {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 62px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(240, 237, 232, 0.92);
      pointer-events: auto;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    .time-axis-track {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(122, 52, 16, 0.6), rgba(74, 61, 55, 0.35));
    }

    .time-axis-handle {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 16px;
      transform: translateY(-50%);
      border: 1px solid #c2560a;
      border-radius: 5px;
      background: #faf9f7;
      cursor: pointer;
      padding: 0;
    }

    .time-axis-handle:hover {
      border-color: #7a3410;
      box-shadow: 0 0 0 1px rgba(122, 52, 16, 0.25);
    }

    .time-axis-handle.start {
      left: 7px;
    }

    .time-axis-handle.end {
      right: 7px;
    }

    .time-axis-date {
      position: absolute;
      top: 3px;
      font-size: 10px;
      color: #7a3410;
      background: rgba(232, 227, 220, 0.95);
      border: 1px solid rgba(122, 52, 16, 0.25);
      border-radius: 6px;
      padding: 1px 6px;
      pointer-events: none;
    }

    .time-axis-date.start {
      left: 22px;
    }

    .time-axis-date.end {
      right: 22px;
    }

    .time-range-vline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      transform: translateX(-50%);
      pointer-events: auto;
      cursor: ew-resize;
      z-index: 4;
    }

    .time-range-vline.start {
      background: linear-gradient(180deg, rgba(194, 86, 10, 0.95), rgba(194, 86, 10, 0.14));
    }

    .time-range-vline.end {
      background: linear-gradient(180deg, rgba(168, 78, 26, 0.95), rgba(168, 78, 26, 0.14));
    }

    .time-range-handles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .time-range-span {
      position: absolute;
      top: 50%;
      height: 2px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(194, 86, 10, 0.75), rgba(168, 78, 26, 0.75));
      pointer-events: none;
    }

    .time-range-handle {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 14px;
      transform: translate(-50%, -50%);
      border-radius: 4px;
      border: 1px solid #c2560a;
      background: #faf9f7;
      pointer-events: auto;
      cursor: ew-resize;
      padding: 0;
      z-index: 6;
    }

    .time-range-handle.end {
      border-color: #a04e1a;
    }

    .time-range-handle:hover {
      box-shadow: 0 0 0 1px rgba(74, 61, 55, 0.25);
    }

    .yaxis-axis {
      position: absolute;
      top: 16px;
      bottom: 74px;
      left: 14px;
      width: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(240, 237, 232, 0.95);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      cursor: crosshair;
    }

    .timeline-axis::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 50%;
      height: 2px;
      background: linear-gradient(90deg, rgba(122, 52, 16, 0.65), rgba(74, 61, 55, 0.45));
      transform: translateY(-50%);
    }

    .yaxis-axis::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 50%;
      width: 2px;
      background: linear-gradient(180deg, rgba(122, 52, 16, 0.65), rgba(74, 61, 55, 0.45));
      transform: translateX(-50%);
    }

    .timeline-axis-label {
      position: absolute;
      left: 12px;
      top: 5px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .yaxis-axis-label {
      position: absolute;
      left: 50%;
      top: 12px;
      transform: translateX(-50%) rotate(-90deg);
      transform-origin: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .timeline-lines {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .timeline-vline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, rgba(122, 52, 16, 0.85), rgba(122, 52, 16, 0.12));
      pointer-events: none;
    }

    .yaxis-hline {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(122, 52, 16, 0.85), rgba(122, 52, 16, 0.12));
      pointer-events: none;
    }

    .timeline-marker {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 2px solid #7a3410;
      background: #faf9f7;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(250, 249, 247, 0.85);
      pointer-events: auto;
      cursor: ew-resize;
      z-index: 2;
    }

    .timeline-marker.selected {
      border-color: #a04e1a;
      background: #a04e1a;
      box-shadow: 0 0 0 2px rgba(250, 249, 247, 0.85), 0 0 0 1px #a04e1a;
    }

    .yaxis-marker {
      position: absolute;
      left: 50%;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 2px solid #7a3410;
      background: #faf9f7;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px rgba(250, 249, 247, 0.85);
      pointer-events: auto;
      cursor: ns-resize;
      z-index: 2;
    }

    .yaxis-marker.selected {
      border-color: #a04e1a;
      background: #a04e1a;
      box-shadow: 0 0 0 2px rgba(250, 249, 247, 0.85), 0 0 0 1px #a04e1a;
    }

    .yaxis-marker-label {
      position: absolute;
      left: calc(50% + 12px);
      top: 50%;
      transform: translateY(-50%);
      max-width: 180px;
      font-size: 11px;
      line-height: 1.2;
      color: #7a3410;
      background: rgba(232, 227, 220, 0.95);
      border: 1px solid rgba(122, 52, 16, 0.38);
      border-radius: 6px;
      padding: 3px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .timeline-marker-label {
      position: absolute;
      bottom: calc(50% + 10px);
      left: 50%;
      transform: translateX(-50%);
      max-width: 180px;
      font-size: 11px;
      line-height: 1.2;
      color: #7a3410;
      background: rgba(232, 227, 220, 0.95);
      border: 1px solid rgba(122, 52, 16, 0.38);
      border-radius: 6px;
      padding: 3px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .board-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .board-viewport.panning { cursor: grabbing; }
    .board-viewport.zooming { cursor: ns-resize; }

    .board-stage {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    #linkLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    #nodeLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .node {
      position: absolute;
      pointer-events: auto;
      height: 130px;
      border: 1px solid var(--border);
      background: rgba(240, 237, 232, 0.98);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .node.selected {
      box-shadow: 0 0 0 2px #a04e1a, 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .node-resize-handle {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 34px;
      transform: translateY(-50%);
      border-radius: 4px;
      border: 1px solid rgba(194, 86, 10, 0.9);
      background: rgba(250, 249, 247, 0.92);
      cursor: ew-resize;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .node:hover .node-resize-handle {
      opacity: 1;
    }

    .node-resize-handle.end {
      border-color: rgba(160, 78, 26, 0.9);
    }

    .node-resize-handle.start { left: -5px; }
    .node-resize-handle.end { right: -5px; }

    .node.drop-target {
      box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .node-port {
      position: absolute;
      left: 50%;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      border: 2px solid rgba(74, 61, 55, 0.82);
      background: #faf9f7;
      transform: translateX(-50%);
      cursor: crosshair;
      z-index: 3;
      box-shadow: 0 0 0 1px rgba(250, 249, 247, 0.95), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .node-port {
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .node:hover .node-port {
      opacity: 1;
    }

    .node-port:hover {
      border-color: var(--accent);
    }

    .node-port-bottom.has-children {
      background: #faf9f7;
      box-shadow: 0 0 0 2px rgba(74, 61, 55, 0.82) inset, 0 0 0 1px rgba(250, 249, 247, 0.95), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .node-port-bottom.has-children.is-collapsed {
      background: rgba(74, 61, 55, 0.82);
      box-shadow: 0 0 0 1px rgba(250, 249, 247, 0.95), 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .node-port-top { top: -7px; }
    .node-port-bottom { bottom: -7px; }

    .node-head {
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      border-bottom: 1px solid rgba(74, 61, 55, 0.2);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .node-type {
      font-size: 11px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 1px 6px;
      font-weight: 600;
      color: #fff;
    }

    .node-title {
      padding: 8px;
      flex: 1 1 auto;
      font-size: 12px;
      line-height: 1.3;
      min-height: 0;
      cursor: text;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      line-clamp: 3;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .node-title.editing {
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
      white-space: pre-wrap;
      overflow: auto;
      text-overflow: clip;
      display: block;
      line-clamp: unset;
      -webkit-line-clamp: unset;
      -webkit-box-orient: initial;
      outline: 1px solid rgba(122, 52, 16, 0.5);
      outline-offset: -1px;
      background: rgba(232, 227, 220, 0.55);
    }

    .node-actions {
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      border-top: 1px solid rgba(74, 61, 55, 0.18);
      background: rgba(248, 247, 245, 0.45);
      flex-wrap: wrap;
    }

    .node-actions button {
      border: 1px solid transparent;
      background: #f0ede8;
      color: var(--text);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 0 0 1px var(--border) inset;
      transition: box-shadow 0.15s ease-out;
    }

    .node-actions button:hover {
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .node-plus {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: #f0ede8;
      color: #4a3d37;
      font-size: 15px;
      line-height: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(74, 61, 55, 0.45) inset, 0 2px 8px rgba(0,0,0,.08);
      transition: box-shadow 0.15s ease-out, color 0.15s ease-out, opacity 0.15s ease;
      opacity: 0;
    }

    .node:hover .node-plus {
      opacity: 1;
    }

    .node-plus:hover {
      box-shadow: 0 0 0 1px var(--accent) inset, 0 2px 8px rgba(0,0,0,.08);
      color: #7a3410;
    }

    .node-plus-right { right: -11px; bottom: 14px; }
    .node-plus-child { right: 14px; bottom: -11px; }

    .node.epic { width: 240px; border-color: rgba(194, 86, 10, 0.6); border-radius: 10px; }
    .node.feature { width: 210px; border-color: rgba(124, 58, 237, 0.6); border-radius: 8px; }
    .node.story { width: 185px; border-color: rgba(29, 78, 216, 0.6); border-radius: 6px; }
    .node.task { width: 165px; border-color: rgba(74, 61, 55, 0.6); border-radius: 6px; border-style: dashed; }

    .node.epic .node-head { background: rgba(194, 86, 10, 0.15); }
    .node.feature .node-head { background: rgba(124, 58, 237, 0.15); }
    .node.story .node-head { background: rgba(29, 78, 216, 0.15); }
    .node.task .node-head { background: rgba(74, 61, 55, 0.15); }

    .node.epic .node-type { background: var(--epic); border-color: rgba(194, 86, 10, 0.7); }
    .node.feature .node-type { background: var(--feature); border-color: rgba(124, 58, 237, 0.7); }
    .node.story .node-type { background: var(--story); border-color: rgba(29, 78, 216, 0.7); }
    .node.task .node-type { background: var(--task); border-color: rgba(74, 61, 55, 0.7); }

    .selection-rect {
      position: absolute;
      border: 1px dashed #a04e1a;
      background: rgba(160, 78, 26, 0.12);
      pointer-events: none;
      z-index: 25;
    }

    .status {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 20;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(240, 237, 232, 0.85);
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .attribute-selector {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(240, 237, 232, 0.95);
      padding: 10px 14px;
      max-width: 500px;
    }

    .attribute-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .attribute-label {
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
      min-width: 50px;
    }

    .sprint-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sprint-chip {
      border: 1px solid rgba(122, 52, 16, 0.38);
      background: rgba(250, 249, 247, 0.8);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .sprint-chip:hover {
      border-color: var(--accent);
      background: rgba(122, 52, 16, 0.15);
    }

    .sprint-chip.active {
      border-color: var(--accent);
      background: rgba(122, 52, 16, 0.25);
      color: #7a3410;
    }

  </style>
</head>
<body>
  <div class="app">
    <main class="right">
      <div class="toolbar">
        <button class="tool-btn" id="undoBtn" disabled>Undo</button>
        <label class="view-toggle" for="viewTreeToggle">
          <input type="checkbox" id="viewTreeToggle" />
          <span>Visa som träd</span>
        </label>
        <label class="view-toggle" for="showTimelineToggle">
          <input type="checkbox" id="showTimelineToggle" />
          <span>Visa X-axel</span>
        </label>
        <label class="view-toggle" for="showTimeAxisToggle">
          <input type="checkbox" id="showTimeAxisToggle" />
          <span>Visa tidsaxel</span>
        </label>
        <label class="view-toggle" for="showYAxisToggle">
          <input type="checkbox" id="showYAxisToggle" />
          <span>Visa Y-axel</span>
        </label>

        <button class="tool-btn" id="setAsViewBtn">Behåll denna vy</button>
        <button class="tool-btn" id="fitBtn">Fit</button>
        <button class="tool-btn" id="clearBtn">Clear</button>
        <span id="selInfo" class="hint">0 selected</span>
      </div>
      <div class="attribute-selector">
        <div class="attribute-row">
          <span class="attribute-label">Sprint:</span>
          <div class="sprint-chips">
            <button class="sprint-chip" data-sprint="Sprint 14">Sprint 14</button>
            <button class="sprint-chip" data-sprint="Sprint 15">Sprint 15</button>
            <button class="sprint-chip" data-sprint="Sprint 16">Sprint 16</button>
          </div>
        </div>
      </div>
      <div id="boardViewport" class="board-viewport">
        <div id="boardStage" class="board-stage">
          <svg id="linkLayer"></svg>
          <div id="nodeLayer"></div>
        </div>
        <div id="selectionRect" class="selection-rect" style="display:none"></div>
      </div>
      <div id="timelineOverlay" class="timeline-overlay" style="display:none">
        <div id="timelineLines" class="timeline-lines"></div>
        <div id="timeAxis" class="time-axis">
          <div class="time-axis-track"></div>
          <div id="timeRangeHandles" class="time-range-handles"></div>
          <button id="timeAxisStartHandle" class="time-axis-handle start" title="Satt startdatum"></button>
          <span id="timeAxisStartDate" class="time-axis-date start">Start: -</span>
          <button id="timeAxisEndHandle" class="time-axis-handle end" title="Satt slutdatum"></button>
          <span id="timeAxisEndDate" class="time-axis-date end">Slut: -</span>
        </div>
        <div id="timelineAxis" class="timeline-axis">
          <span class="timeline-axis-label">X-axel</span>
          <div id="timelineMarkers"></div>
        </div>
        <div id="yAxis" class="yaxis-axis">
          <span class="yaxis-axis-label">Y-axel</span>
          <div id="yAxisMarkers"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const UNDO_LIMIT = 20;
    const TYPE_ORDER = ["Epic", "Feature", "Story", "Task"];
    const TYPE_COLORS = {
      Epic: "#c2560a",
      Feature: "#7c3aed",
      Story: "#1d4ed8",
      Task: "#4a3d37",
    };

    const state = {
      nodes: [],
      panX: 0,
      panY: 0,
      zoom: 1,
      selectedNodeIds: new Set(),
      selectedMilestoneIds: new Set(),
      selectedYMilestoneIds: new Set(),
      selectionRect: null,
      isSelecting: false,
      dragNodeId: null,
      dragStartPointer: null,
      dragNodeStart: new Map(),
      isPanning: false,
      panStart: null,
      isZooming: false,
      zoomStart: null,
      linkDrag: null,
      dragSnapshot: null,
      dragDidMove: false,
      linkSnapshot: null,
      historyStack: [],
      viewMode: "free",
      freeLayoutPositions: null,
      showTimeline: false,
      showTimeAxis: false,
      showYAxis: false,
      timelineStartDate: null,
      timelineEndDate: null,
      milestones: [],
      milestoneSeq: 1,
      yMilestones: [],
      yMilestoneSeq: 1,
      timelineDrag: null,
      yAxisDrag: null,
      nodeRangeDrag: null,
      titleEdit: null,
      idSeq: 1,
    };

    const viewportEl = document.getElementById("boardViewport");
    const stageEl = document.getElementById("boardStage");
    const linkLayerEl = document.getElementById("linkLayer");
    const nodeLayerEl = document.getElementById("nodeLayer");
    const selectionRectEl = document.getElementById("selectionRect");
    const selInfoEl = document.getElementById("selInfo");
    const undoBtnEl = document.getElementById("undoBtn");
    const viewTreeToggleEl = document.getElementById("viewTreeToggle");
    const showTimelineToggleEl = document.getElementById("showTimelineToggle");
    const showTimeAxisToggleEl = document.getElementById("showTimeAxisToggle");
    const showYAxisToggleEl = document.getElementById("showYAxisToggle");
    const setAsViewBtnEl = document.getElementById("setAsViewBtn");
    const timelineOverlayEl = document.getElementById("timelineOverlay");
    const timelineAxisEl = document.getElementById("timelineAxis");
    const timelineLinesEl = document.getElementById("timelineLines");
    const timelineMarkersEl = document.getElementById("timelineMarkers");
    const timeAxisEl = document.getElementById("timeAxis");
    const timeRangeHandlesEl = document.getElementById("timeRangeHandles");
    const timeAxisStartHandleEl = document.getElementById("timeAxisStartHandle");
    const timeAxisEndHandleEl = document.getElementById("timeAxisEndHandle");
    const timeAxisStartDateEl = document.getElementById("timeAxisStartDate");
    const timeAxisEndDateEl = document.getElementById("timeAxisEndDate");
    const yAxisEl = document.getElementById("yAxis");
    const yAxisMarkersEl = document.getElementById("yAxisMarkers");

    function nextType(type) {
      const idx = TYPE_ORDER.indexOf(type);
      if (idx < 0 || idx >= TYPE_ORDER.length - 1) return null;
      return TYPE_ORDER[idx + 1];
    }

    function typeClass(type) {
      return String(type || "").toLowerCase();
    }

    function getNodeById(id) {
      return state.nodes.find(n => n.id === id) || null;
    }

    function descendantsOf(id) {
      const out = [];
      const stack = [id];
      while (stack.length) {
        const parentId = stack.pop();
        state.nodes.forEach(n => {
          if (n.parentId === parentId) {
            out.push(n.id);
            stack.push(n.id);
          }
        });
      }
      return out;
    }

    function isDescendant(targetId, maybeAncestorId) {
      const desc = descendantsOf(maybeAncestorId);
      return desc.includes(targetId);
    }

    function visibleNodeIds() {
      const hidden = new Set();
      state.nodes.forEach(node => {
        if (!node.collapsed) return;
        descendantsOf(node.id).forEach(id => hidden.add(id));
      });
      return new Set(state.nodes.filter(n => !hidden.has(n.id)).map(n => n.id));
    }

    function boardToScreen(x, y) {
      const viewportRect = viewportEl.getBoundingClientRect();
      return {
        x: x * state.zoom + state.panX + viewportRect.left,
        y: y * state.zoom + state.panY + viewportRect.top,
      };
    }

    function screenToBoard(x, y) {
      const viewportRect = viewportEl.getBoundingClientRect();
      return {
        x: (x - viewportRect.left - state.panX) / state.zoom,
        y: (y - viewportRect.top - state.panY) / state.zoom,
      };
    }

    function clampZoom(z) {
      return Math.max(0.5, Math.min(1.8, z));
    }

    function createHistorySnapshot() {
      return {
        nodes: state.nodes.map(node => ({ ...node })),
        selectedNodeIds: Array.from(state.selectedNodeIds),
        selectedMilestoneIds: Array.from(state.selectedMilestoneIds),
        selectedYMilestoneIds: Array.from(state.selectedYMilestoneIds),
        freeLayoutPositions: state.freeLayoutPositions
          ? Array.from(state.freeLayoutPositions.entries()).map(([id, pos]) => [id, { x: pos.x, y: pos.y }])
          : null,
        viewMode: state.viewMode,
        showTimeline: state.showTimeline,
        showTimeAxis: state.showTimeAxis,
        showYAxis: state.showYAxis,
        timelineStartDate: state.timelineStartDate,
        timelineEndDate: state.timelineEndDate,
        milestones: state.milestones.map(m => ({ ...m })),
        milestoneSeq: state.milestoneSeq,
        yMilestones: state.yMilestones.map(m => ({ ...m })),
        yMilestoneSeq: state.yMilestoneSeq,
        idSeq: state.idSeq,
      };
    }

    function updateUndoButton() {
      undoBtnEl.disabled = state.historyStack.length === 0;
    }

    function updateViewToggle() {
      viewTreeToggleEl.checked = state.viewMode === "tree";
    }

    function updateTimelineToggle() {
      showTimelineToggleEl.checked = state.showTimeline;
      showTimeAxisToggleEl.checked = state.showTimeAxis;
      showYAxisToggleEl.checked = state.showYAxis;
    }

    function captureFreeLayoutPositions() {
      const snapshot = new Map();
      state.nodes.forEach(node => {
        snapshot.set(node.id, { x: node.x, y: node.y });
      });
      state.freeLayoutPositions = snapshot;
    }

    function setCurrentViewAsFreeLayout() {
      captureFreeLayoutPositions();
    }

    function restoreFreeLayoutPositions() {
      if (!state.freeLayoutPositions) return;
      state.nodes.forEach(node => {
        const pos = state.freeLayoutPositions.get(node.id);
        if (!pos) return;
        node.x = pos.x;
        node.y = pos.y;
      });
      state.freeLayoutPositions = null;
    }

    function applyTreeLayout() {
      if (!state.nodes.length) return;

      const nodeById = new Map(state.nodes.map(node => [node.id, node]));
      const childrenByParent = new Map();
      state.nodes.forEach(node => {
        const key = node.parentId;
        if (!childrenByParent.has(key)) childrenByParent.set(key, []);
        childrenByParent.get(key).push(node);
      });

      const sortNodes = (a, b) => {
        const pa = getFreePosition(a);
        const pb = getFreePosition(b);
        return (pa.x - pb.x) || (pa.y - pb.y) || (a.id - b.id);
      };
      const roots = state.nodes
        .filter(node => node.parentId == null || !nodeById.has(node.parentId))
        .sort(sortNodes);

      const siblingGap = 34;
      const rootGap = 84;
      const levelGap = 190;
      const startX = 80;
      const startY = 90;
      const widthMemo = new Map();

      function childrenOf(parentId) {
        const children = childrenByParent.get(parentId) || [];
        return children.slice().sort(sortNodes);
      }

      function subtreeWidth(node, pathSet) {
        if (widthMemo.has(node.id)) return widthMemo.get(node.id);
        if (pathSet.has(node.id)) return getNodeWidth(node);

        pathSet.add(node.id);
        const ownWidth = getNodeWidth(node);
        const children = childrenOf(node.id);
        if (!children.length) {
          pathSet.delete(node.id);
          widthMemo.set(node.id, ownWidth);
          return ownWidth;
        }

        let sumChildren = 0;
        children.forEach((child, idx) => {
          const childWidth = subtreeWidth(child, pathSet);
          sumChildren += childWidth;
          if (idx < children.length - 1) sumChildren += siblingGap;
        });

        pathSet.delete(node.id);
        const result = Math.max(ownWidth, sumChildren);
        widthMemo.set(node.id, result);
        return result;
      }

      function placeNode(node, left, depth, pathSet) {
        if (pathSet.has(node.id)) return;
        pathSet.add(node.id);

        const blockWidth = subtreeWidth(node, new Set());
        const ownWidth = getNodeWidth(node);
        node.x = left + (blockWidth - ownWidth) / 2;
        node.y = startY + depth * levelGap;

        const children = childrenOf(node.id);
        let cursor = left;
        children.forEach(child => {
          const childWidth = subtreeWidth(child, new Set());
          placeNode(child, cursor, depth + 1, pathSet);
          cursor += childWidth + siblingGap;
        });

        pathSet.delete(node.id);
      }

      let cursor = startX;
      roots.forEach(root => {
        const rootWidth = subtreeWidth(root, new Set());
        placeNode(root, cursor, 0, new Set());
        cursor += rootWidth + rootGap;
      });
    }

    function pushHistorySnapshot(snapshot) {
      if (!snapshot) return;
      state.historyStack.push(snapshot);
      if (state.historyStack.length > UNDO_LIMIT) state.historyStack.shift();
      updateUndoButton();
    }

    function recordHistory() {
      pushHistorySnapshot(createHistorySnapshot());
    }

    function restoreHistorySnapshot(snapshot) {
      state.nodes = snapshot.nodes.map(node => ({ ...node }));
      state.selectedNodeIds = new Set(snapshot.selectedNodeIds);
      state.selectedMilestoneIds = new Set(snapshot.selectedMilestoneIds || []);
      state.selectedYMilestoneIds = new Set(snapshot.selectedYMilestoneIds || []);
      state.freeLayoutPositions = snapshot.freeLayoutPositions
        ? new Map(snapshot.freeLayoutPositions.map(([id, pos]) => [id, { x: pos.x, y: pos.y }]))
        : null;
      state.viewMode = snapshot.viewMode || "free";
      state.showTimeline = Boolean(snapshot.showTimeline);
      state.showTimeAxis = Boolean(snapshot.showTimeAxis);
      state.showYAxis = Boolean(snapshot.showYAxis);
      state.timelineStartDate = snapshot.timelineStartDate || null;
      state.timelineEndDate = snapshot.timelineEndDate || null;
      state.milestones = Array.isArray(snapshot.milestones) ? snapshot.milestones.map(m => ({ ...m })) : [];
      state.milestoneSeq = Number.isFinite(snapshot.milestoneSeq) ? snapshot.milestoneSeq : 1;
      state.yMilestones = Array.isArray(snapshot.yMilestones) ? snapshot.yMilestones.map(m => ({ ...m })) : [];
      state.yMilestoneSeq = Number.isFinite(snapshot.yMilestoneSeq) ? snapshot.yMilestoneSeq : 1;
      state.idSeq = snapshot.idSeq;
      state.selectionRect = null;
      state.isSelecting = false;
      state.dragNodeId = null;
      state.dragStartPointer = null;
      state.dragNodeStart = new Map();
      state.dragSnapshot = null;
      state.dragDidMove = false;
      state.isPanning = false;
      state.panStart = null;
      state.isZooming = false;
      state.zoomStart = null;
      state.linkDrag = null;
      state.linkSnapshot = null;
      state.timelineDrag = null;
      state.yAxisDrag = null;
      state.nodeRangeDrag = null;
      renderBoard();
    }

    function getFreePosition(node) {
      if (state.freeLayoutPositions && state.freeLayoutPositions.has(node.id)) {
        const p = state.freeLayoutPositions.get(node.id);
        return { x: p.x, y: p.y };
      }
      return { x: node.x, y: node.y };
    }

    function setFreePosition(nodeId, x, y) {
      if (!state.freeLayoutPositions) return;
      state.freeLayoutPositions.set(nodeId, { x, y });
    }

    function shiftSubtreeFreeLayout(rootId, dx, dy) {
      if (!state.freeLayoutPositions) return;
      const ids = [rootId, ...descendantsOf(rootId)];
      ids.forEach(id => {
        const node = getNodeById(id);
        if (!node) return;
        const pos = getFreePosition(node);
        setFreePosition(id, pos.x + dx, pos.y + dy);
      });
    }

    function undo() {
      const snapshot = state.historyStack.pop();
      if (!snapshot) return;
      updateUndoButton();
      restoreHistorySnapshot(snapshot);
    }

    function getMilestoneBoardX(milestone) {
      if (Number.isFinite(milestone.boardX)) return milestone.boardX;
      const viewportRect = viewportEl.getBoundingClientRect();
      const legacyPos = Math.max(0, Math.min(1, Number(milestone.pos) || 0));
      const screenX = viewportRect.left + legacyPos * viewportRect.width;
      return (screenX - viewportRect.left - state.panX) / state.zoom;
    }

    function getYMilestoneBoardY(milestone) {
      if (Number.isFinite(milestone.boardY)) return milestone.boardY;
      const viewportRect = viewportEl.getBoundingClientRect();
      const legacyPos = Math.max(0, Math.min(1, Number(milestone.pos) || 0));
      const screenY = viewportRect.top + legacyPos * viewportRect.height;
      return (screenY - viewportRect.top - state.panY) / state.zoom;
    }

    function parseIsoDateToMs(value) {
      if (!value) return null;
      const ms = Date.parse(`${value}T00:00:00`);
      return Number.isFinite(ms) ? ms : null;
    }

    function formatDateISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function getTimelineBoundsMs() {
      const now = Date.now();
      const fallbackStart = now;
      const fallbackEnd = now + (56 * 24 * 60 * 60 * 1000);
      let startMs = parseIsoDateToMs(state.timelineStartDate);
      let endMs = parseIsoDateToMs(state.timelineEndDate);
      if (startMs == null) startMs = fallbackStart;
      if (endMs == null) endMs = fallbackEnd;
      if (endMs <= startMs) endMs = startMs + (24 * 60 * 60 * 1000);
      return { startMs, endMs };
    }

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function msToRatio(ms, startMs, endMs) {
      if (!Number.isFinite(ms) || endMs <= startMs) return 0;
      return clamp01((ms - startMs) / (endMs - startMs));
    }

    function ratioToMs(ratio, startMs, endMs) {
      if (endMs <= startMs) return startMs;
      return startMs + clamp01(ratio) * (endMs - startMs);
    }

    function getTimeAxisBoardRange() {
      const timeRect = timeAxisEl.getBoundingClientRect();
      const viewportRect = viewportEl.getBoundingClientRect();
      const trackLeftScreen = timeRect.left + 12;
      const trackRightScreen = timeRect.right - 12;
      const leftBoard = (trackLeftScreen - viewportRect.left - state.panX) / state.zoom;
      const rightBoard = (trackRightScreen - viewportRect.left - state.panX) / state.zoom;
      return { leftBoard, rightBoard };
    }

    function snapMsToDay(ms) {
      const dayMs = 24 * 60 * 60 * 1000;
      return Math.round(ms / dayMs) * dayMs;
    }

    function syncNodeDatesFromLayout(node) {
      if (!state.showTimeAxis) return;
      const existingStart = parseIsoDateToMs(node.timeStartDate);
      const existingEnd = parseIsoDateToMs(node.timeEndDate);
      if (existingStart == null || existingEnd == null) return;
      const durationMs = Math.max(24 * 60 * 60 * 1000, existingEnd - existingStart);

      const { startMs, endMs } = getTimelineBoundsMs();
      const { leftBoard, rightBoard } = getTimeAxisBoardRange();
      const spanBoard = rightBoard - leftBoard;
      if (!Number.isFinite(spanBoard) || spanBoard <= 0.0001) return;

      const startRatio = clamp01((node.x - leftBoard) / spanBoard);
      let nextStartMs = ratioToMs(startRatio, startMs, endMs);
      nextStartMs = snapMsToDay(nextStartMs);
      const nextEndMs = nextStartMs + durationMs;

      node.timeStartDate = formatDateISO(new Date(nextStartMs));
      node.timeEndDate = formatDateISO(new Date(nextEndMs));
    }

    function getNodeTimeRange(node) {
      const { startMs, endMs } = getTimelineBoundsMs();
      const startDateMs = parseIsoDateToMs(node.timeStartDate);
      const endDateMs = parseIsoDateToMs(node.timeEndDate);

      let start = startDateMs;
      let end = endDateMs;

      if ((start == null || end == null) && state.showTimeAxis) {
        const timeRect = timeAxisEl.getBoundingClientRect();
        if (timeRect.width > 1) {
          const { leftBoard, rightBoard } = getTimeAxisBoardRange();
          const spanBoard = rightBoard - leftBoard;
          if (Number.isFinite(spanBoard) && spanBoard > 0.0001) {
            const rect = nodeRect(node);
            const inferredStartRatio = clamp01((rect.x - leftBoard) / spanBoard);
            const inferredEndRatio = clamp01(((rect.x + rect.w) - leftBoard) / spanBoard);
            if (start == null) start = ratioToMs(inferredStartRatio, startMs, endMs);
            if (end == null) end = ratioToMs(inferredEndRatio, startMs, endMs);
          }
        }
      }

      if (start == null) start = startMs;
      if (end == null) end = endMs;
      if (start > end) {
        const tmp = start;
        start = end;
        end = tmp;
      }

      return {
        startMs: start,
        endMs: end,
        startRatio: msToRatio(start, startMs, endMs),
        endRatio: msToRatio(end, startMs, endMs),
      };
    }

    function renderTimeline() {
      if (!state.showTimeline && !state.showTimeAxis && !state.showYAxis) {
        timelineOverlayEl.style.display = "none";
        return;
      }

      if (state.viewMode === "tree") {
        timelineOverlayEl.style.display = "none";
        return;
      }

      timelineOverlayEl.style.display = "block";
      timeAxisEl.style.display = state.showTimeAxis ? "block" : "none";
      timelineAxisEl.style.display = state.showTimeline ? "block" : "none";
      yAxisEl.style.display = state.showYAxis ? "block" : "none";

      timeAxisStartDateEl.textContent = `Start: ${state.timelineStartDate || "-"}`;
      timeAxisEndDateEl.textContent = `Slut: ${state.timelineEndDate || "-"}`;

      const overlayRect = timelineOverlayEl.getBoundingClientRect();
      const axisRect = timelineAxisEl.getBoundingClientRect();
      const timeRect = timeAxisEl.getBoundingClientRect();
      const timeTrackLeft = timeRect.left + 12;
      const timeTrackRight = timeRect.right - 12;
      const timeTrackWidth = Math.max(1, timeTrackRight - timeTrackLeft);
      const markers = [];
      const lines = [];
      const rangeLines = [];
      const rangeHandles = [];
      if (state.showTimeline) {
        state.milestones.forEach(milestone => {
          const boardX = getMilestoneBoardX(milestone);
          const screen = boardToScreen(boardX, 0);
          const lineLeft = screen.x - overlayRect.left;
          const markerLeft = screen.x - axisRect.left;
          const selectedClass = state.selectedMilestoneIds.has(milestone.id) ? " selected" : "";
          lines.push(`<div class="timeline-vline" style="left:${lineLeft}px" title="${escapeHtml(milestone.text)}"></div>`);
          markers.push(`
            <button class="timeline-marker${selectedClass}" data-ms-id="${milestone.id}" style="left:${markerLeft}px" title="${escapeHtml(milestone.text)}">
              <span class="timeline-marker-label">${escapeHtml(milestone.text)}</span>
            </button>
          `);
        });
      }

      if (state.showTimeAxis) {
        const visibleIds = visibleNodeIds();
        state.nodes.forEach(node => {
          if (!state.selectedNodeIds.has(node.id) || !visibleIds.has(node.id)) return;
          const range = getNodeTimeRange(node);
          const rect = nodeRect(node);
          const startScreenX = boardToScreen(rect.x, 0).x;
          const endScreenX = boardToScreen(rect.x + rect.w, 0).x;
          const startLeftOverlay = startScreenX - overlayRect.left;
          const endLeftOverlay = endScreenX - overlayRect.left;
          const startLeftAxis = startScreenX - timeRect.left;
          const endLeftAxis = endScreenX - timeRect.left;
          const spanLeft = Math.min(startLeftAxis, endLeftAxis);
          const spanWidth = Math.max(1, Math.abs(endLeftAxis - startLeftAxis));

          rangeLines.push(`<div class="time-range-vline start" data-range-node-id="${node.id}" data-range-side="start" style="left:${startLeftOverlay}px" title="Dra for att justera start"></div>`);
          rangeLines.push(`<div class="time-range-vline end" data-range-node-id="${node.id}" data-range-side="end" style="left:${endLeftOverlay}px" title="Dra for att justera slut"></div>`);
          rangeHandles.push(`<div class="time-range-span" style="left:${spanLeft}px;width:${spanWidth}px"></div>`);
          rangeHandles.push(`<button class="time-range-handle start" data-range-node-id="${node.id}" data-range-side="start" style="left:${startLeftAxis}px" title="Justera start for #${node.id}: ${escapeHtml(formatDateISO(new Date(range.startMs)))}"></button>`);
          rangeHandles.push(`<button class="time-range-handle end" data-range-node-id="${node.id}" data-range-side="end" style="left:${endLeftAxis}px" title="Justera slut for #${node.id}: ${escapeHtml(formatDateISO(new Date(range.endMs)))}"></button>`);
        });
      }

      timelineLinesEl.innerHTML = lines.join("") + rangeLines.join("");
      timelineMarkersEl.innerHTML = markers.join("");
      timeRangeHandlesEl.innerHTML = rangeHandles.join("");

      const beginNodeRangeDrag = (nodeId, side, e) => {
        const node = getNodeById(nodeId);
        if (!node || (side !== "start" && side !== "end")) return;
        const range = getNodeTimeRange(node);
        const rect = nodeRect(node);
        const timeRect = timeAxisEl.getBoundingClientRect();
        const trackLeft = timeRect.left + 12;
        const trackRight = timeRect.right - 12;
        const trackWidth = Math.max(1, trackRight - trackLeft);
        const pointerRatio = clamp01((e.clientX - trackLeft) / trackWidth);
        const handleRatio = side === "start" ? range.startRatio : range.endRatio;
        node.timeStartDate = formatDateISO(new Date(range.startMs));
        node.timeEndDate = formatDateISO(new Date(range.endMs));
        state.nodeRangeDrag = {
          nodeId,
          side,
          anchorLeftX: rect.x,
          anchorRightX: rect.x + rect.w,
          dragOffsetRatio: pointerRatio - handleRatio,
          didMove: false,
          snapshot: createHistorySnapshot(),
        };
        e.preventDefault();
      };

      timelineLinesEl.querySelectorAll(".time-range-vline").forEach(line => {
        line.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          const nodeId = Number(line.getAttribute("data-range-node-id"));
          const side = line.getAttribute("data-range-side");
          beginNodeRangeDrag(nodeId, side, e);
        });
      });

      timeRangeHandlesEl.querySelectorAll(".time-range-handle").forEach(btn => {
        btn.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          const nodeId = Number(btn.getAttribute("data-range-node-id"));
          const side = btn.getAttribute("data-range-side");
          beginNodeRangeDrag(nodeId, side, e);
        });
      });

      timelineMarkersEl.querySelectorAll(".timeline-marker").forEach(btn => {
        btn.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          const id = Number(btn.getAttribute("data-ms-id"));
          const item = state.milestones.find(m => m.id === id);
          if (!item) return;
          state.timelineDrag = {
            id,
            startBoardX: getMilestoneBoardX(item),
            startClientX: e.clientX,
            toggle: e.ctrlKey || e.metaKey,
            didMove: false,
            snapshot: createHistorySnapshot(),
          };
          e.preventDefault();
        });
      });

      const yRect = yAxisEl.getBoundingClientRect();
      const yMarkers = [];
      const yLines = [];
      if (state.showYAxis) {
        state.yMilestones.forEach(milestone => {
          const boardY = getYMilestoneBoardY(milestone);
          const screen = boardToScreen(0, boardY);
          const lineTop = screen.y - overlayRect.top;
          const markerTop = screen.y - yRect.top;
          const selectedClass = state.selectedYMilestoneIds.has(milestone.id) ? " selected" : "";
          yLines.push(`<div class="yaxis-hline" style="top:${lineTop}px" title="${escapeHtml(milestone.text)}"></div>`);
          yMarkers.push(`
            <button class="yaxis-marker${selectedClass}" data-y-ms-id="${milestone.id}" style="top:${markerTop}px" title="${escapeHtml(milestone.text)}">
              <span class="yaxis-marker-label">${escapeHtml(milestone.text)}</span>
            </button>
          `);
        });
      }

      timelineLinesEl.innerHTML += yLines.join("");
      yAxisMarkersEl.innerHTML = yMarkers.join("");

      yAxisMarkersEl.querySelectorAll(".yaxis-marker").forEach(btn => {
        btn.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          const id = Number(btn.getAttribute("data-y-ms-id"));
          const item = state.yMilestones.find(m => m.id === id);
          if (!item) return;
          state.yAxisDrag = {
            id,
            startBoardY: getYMilestoneBoardY(item),
            startClientY: e.clientY,
            toggle: e.ctrlKey || e.metaKey,
            didMove: false,
            snapshot: createHistorySnapshot(),
          };
          e.preventDefault();
        });
      });
    }

    function setTransform() {
      stageEl.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
      if (state.showTimeline || state.showTimeAxis || state.showYAxis) renderTimeline();
    }

    function updateSelectionInfo() {
      const total = state.selectedNodeIds.size + state.selectedMilestoneIds.size + state.selectedYMilestoneIds.size;
      selInfoEl.textContent = `${total} selected`;
    }

    function deleteMilestones(ids, options = {}) {
      const { record = true, render = true } = options;
      if (!ids || !ids.size) return;
      if (record) recordHistory();
      state.milestones = state.milestones.filter(m => !ids.has(m.id));
      state.selectedMilestoneIds = new Set(Array.from(state.selectedMilestoneIds).filter(id => !ids.has(id)));
      if (render) renderBoard();
    }

    function deleteYMilestones(ids, options = {}) {
      const { record = true, render = true } = options;
      if (!ids || !ids.size) return;
      if (record) recordHistory();
      state.yMilestones = state.yMilestones.filter(m => !ids.has(m.id));
      state.selectedYMilestoneIds = new Set(Array.from(state.selectedYMilestoneIds).filter(id => !ids.has(id)));
      if (render) renderBoard();
    }

    function createNodeFromIssue(issue, boardX, boardY) {
      const node = {
        id: state.idSeq++,
        title: issue.title,
        type: issue.type,
        x: boardX,
        y: boardY,
        parentId: null,
        collapsed: false,
        sourceWorkItemId: issue.id,
        sprint: null,
      };
      state.nodes.push(node);
      if (state.viewMode === "tree" && state.freeLayoutPositions) {
        setFreePosition(node.id, node.x, node.y);
      }
      return node;
    }

    function findBestSiblingPosition(node) {
      const siblings = state.nodes.filter(n => n.parentId === node.parentId && n.id !== node.id);
      const nodePos = getFreePosition(node);
      if (siblings.length === 0) {
        return { x: nodePos.x + 32, y: nodePos.y + 28 };
      }
      let rightmost = node;
      let rightmostPos = nodePos;
      let rightmostX = nodePos.x + getNodeWidth(node);
      siblings.forEach(sib => {
        const sibPos = getFreePosition(sib);
        const sibRect = { x: sibPos.x, y: sibPos.y, w: getNodeWidth(sib), h: 130 };
        const sibRight = sibRect.x + sibRect.w;
        if (sibRight > rightmostX) {
          rightmost = sib;
          rightmostPos = sibPos;
          rightmostX = sibRight;
        }
      });
      const gap = 15;
      const nodeWidth = getNodeWidth(rightmost);
      const newX = rightmostPos.x + nodeWidth + gap;
      const newY = rightmostPos.y + 20;
      return { x: newX, y: newY };
    }

    function createSiblingNode(node) {
      recordHistory();
      const pos = findBestSiblingPosition(node);
      const sibling = {
        id: state.idSeq++,
        title: `New ${node.type}`,
        type: node.type,
        x: pos.x,
        y: pos.y,
        parentId: node.parentId,
        collapsed: false,
        sourceWorkItemId: null,
      };
      state.nodes.push(sibling);
      if (state.viewMode === "tree" && state.freeLayoutPositions) {
        setFreePosition(sibling.id, sibling.x, sibling.y);
      }
      state.selectedNodeIds = new Set([sibling.id]);
      renderBoard();
    }

    function findBestChildPosition(node, excludeId = null) {
      const parentPos = getFreePosition(node);
      const children = state.nodes.filter(n => n.parentId === node.id && n.id !== excludeId);
      if (children.length === 0) {
        return { x: parentPos.x + 30, y: parentPos.y + 150 };
      }
      let rightmost = children[0];
      let rightmostPos = getFreePosition(children[0]);
      let rightmostX = rightmostPos.x + getNodeWidth(rightmost);
      let childY = rightmostPos.y;
      children.forEach(child => {
        const childPos = getFreePosition(child);
        const childRight = childPos.x + getNodeWidth(child);
        if (childRight > rightmostX) {
          rightmost = child;
          rightmostPos = childPos;
          rightmostX = childRight;
        }
        childY = childPos.y;
      });
      const gap = 15;
      const newX = rightmostPos.x + getNodeWidth(rightmost) + gap;
      const newY = childY;
      return { x: newX, y: newY };
    }

    function createChildNode(node) {
      const childType = nextType(node.type);
      if (!childType) return;
      recordHistory();
      const pos = findBestChildPosition(node);
      const child = {
        id: state.idSeq++,
        title: `New ${childType}`,
        type: childType,
        x: pos.x,
        y: pos.y,
        parentId: node.id,
        collapsed: false,
        sourceWorkItemId: null,
      };
      state.nodes.push(child);
      node.collapsed = false;
      if (state.viewMode === "tree" && state.freeLayoutPositions) {
        setFreePosition(child.id, child.x, child.y);
      }
      state.selectedNodeIds = new Set([child.id]);
      renderBoard();
    }

    function deleteNodes(ids) {
      if (!ids.size) return;
      recordHistory();
      const allToDelete = new Set();
      ids.forEach(id => {
        allToDelete.add(id);
        descendantsOf(id).forEach(d => allToDelete.add(d));
      });

      state.nodes = state.nodes.filter(n => !allToDelete.has(n.id));
      state.nodes.forEach(n => {
        if (n.parentId != null && allToDelete.has(n.parentId)) n.parentId = null;
      });
      if (state.freeLayoutPositions) {
        allToDelete.forEach(id => state.freeLayoutPositions.delete(id));
      }

      state.selectedNodeIds = new Set();
      renderBoard();
    }

    function canReparentTo(node, parent) {
      if (!node || !parent) return false;
      if (parent.id === node.id || isDescendant(parent.id, node.id)) return false;
      const parentIdx = TYPE_ORDER.indexOf(parent.type);
      const nodeIdx = TYPE_ORDER.indexOf(node.type);
      return parentIdx === nodeIdx - 1;
    }

    function hasChildren(nodeId) {
      return state.nodes.some(n => n.parentId === nodeId);
    }

    function getPortPosition(node, portRole) {
      const rect = nodeRect(node);
      return {
        x: rect.x + rect.w / 2,
        y: portRole === "parent" ? rect.y : rect.y + rect.h,
      };
    }

    function canLinkWithPort(sourceNode, sourcePort, targetNode) {
      if (!sourceNode || !targetNode) return false;
      if (sourcePort === "child") return canReparentTo(targetNode, sourceNode);
      return canReparentTo(sourceNode, targetNode);
    }

    function findLinkTargetCandidate(sourceNode, sourcePort, boardX, boardY) {
      const targetPort = sourcePort === "child" ? "parent" : "child";
      const hitRadius = 16;
      for (let i = state.nodes.length - 1; i >= 0; i -= 1) {
        const candidate = state.nodes[i];
        if (candidate.id === sourceNode.id) continue;
        if (!canLinkWithPort(sourceNode, sourcePort, candidate)) continue;
        const port = getPortPosition(candidate, targetPort);
        const dx = boardX - port.x;
        const dy = boardY - port.y;
        if ((dx * dx) + (dy * dy) <= hitRadius * hitRadius) return candidate;
      }
      return null;
    }

    function openReparent(node) {
      const allowedParentType = TYPE_ORDER[Math.max(0, TYPE_ORDER.indexOf(node.type) - 1)] || null;
      const candidates = state.nodes.filter(n => {
        if (n.id === node.id) return false;
        if (allowedParentType && n.type !== allowedParentType) return false;
        if (isDescendant(n.id, node.id)) return false;
        return true;
      });

      const list = ["none", ...candidates.map(n => `${n.id}:${n.title}`)].join("\n");
      const input = prompt(`Choose parent for '${node.title}'\nType node id or 'none':\n${list}`, node.parentId == null ? "none" : String(node.parentId));
      if (input == null) return;

      const value = String(input).trim().toLowerCase();
      if (!value || value === "none" || value === "null") {
        recordHistory();
        node.parentId = null;
        renderBoard();
        return;
      }

      const parentId = Number(value);
      if (!Number.isFinite(parentId)) {
        alert("Invalid parent id");
        return;
      }

      const parent = getNodeById(parentId);
      if (!parent) {
        alert("Parent not found");
        return;
      }

      if (parent.id === node.id || isDescendant(parent.id, node.id)) {
        alert("Invalid parent: cycle detected");
        return;
      }

      const parentIdx = TYPE_ORDER.indexOf(parent.type);
      const nodeIdx = TYPE_ORDER.indexOf(node.type);
      if (parentIdx !== nodeIdx - 1) {
        alert("Invalid hierarchy. Allowed: Epic -> Feature -> Story -> Task");
        return;
      }

      recordHistory();
      node.parentId = parent.id;
      renderBoard();
    }

    function getBaseNodeWidth(type) {
      return type === "Epic" ? 240 : type === "Feature" ? 210 : type === "Story" ? 185 : 165;
    }

    function getNodeWidth(nodeOrType) {
      if (!nodeOrType || typeof nodeOrType === "string") {
        return getBaseNodeWidth(String(nodeOrType || "Task"));
      }

      const node = nodeOrType;
      const baseWidth = getBaseNodeWidth(node.type);
      const startMs = parseIsoDateToMs(node.timeStartDate);
      const endMs = parseIsoDateToMs(node.timeEndDate);
      if (startMs == null || endMs == null) return baseWidth;

      const timelineBounds = getTimelineBoundsMs();
      const dayMs = 24 * 60 * 60 * 1000;
      const totalSpan = Math.max(dayMs, timelineBounds.endMs - timelineBounds.startMs);
      const duration = Math.max(dayMs, endMs - startMs);
      const ratio = duration / totalSpan;

      if (node.boardWidth != null && Number.isFinite(node.boardWidth) && node.boardWidth > 0) {
        return node.boardWidth;
      }
      return baseWidth;
    }

    function computeBoardWidth(durationMs) {
      const { startMs, endMs } = getTimelineBoundsMs();
      const dayMs = 24 * 60 * 60 * 1000;
      const totalSpan = Math.max(dayMs, endMs - startMs);
      const dur = Math.max(dayMs, durationMs);
      const ratio = dur / totalSpan;
      const { leftBoard, rightBoard } = getTimeAxisBoardRange();
      const axisSpan = rightBoard - leftBoard;
      if (!Number.isFinite(axisSpan) || axisSpan <= 0.0001) return null;
      return Math.max(4, ratio * axisSpan);
    }

    function syncNodeXFromDates(node) {
      if (!node.timeStartDate) return;
      const dateMs = parseIsoDateToMs(node.timeStartDate);
      if (dateMs == null) return;
      const { startMs, endMs } = getTimelineBoundsMs();
      const ratio = msToRatio(dateMs, startMs, endMs);
      const { leftBoard, rightBoard } = getTimeAxisBoardRange();
      const axisSpan = rightBoard - leftBoard;
      if (!Number.isFinite(axisSpan) || axisSpan <= 0.0001) return;
      node.x = leftBoard + ratio * axisSpan;
    }

    function nodeRect(node) {
      const width = getNodeWidth(node);
      const height = 130;
      return { x: node.x, y: node.y, w: width, h: height };
    }

    function renderLinks(visibleIds) {
      const lines = [];
      state.nodes.forEach(child => {
        if (!visibleIds.has(child.id)) return;
        if (child.parentId == null) return;
        const parent = getNodeById(child.parentId);
        if (!parent || !visibleIds.has(parent.id)) return;

        const pr = nodeRect(parent);
        const cr = nodeRect(child);

        const x1 = pr.x + pr.w / 2;
        const y1 = pr.y + pr.h;
        const x2 = cr.x + cr.w / 2;
        const y2 = cr.y;

        lines.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${TYPE_COLORS[child.type] || "#4a3d37"}" stroke-width="2" opacity="0.9" />`);
      });
      if (state.linkDrag) {
        const sourceNode = getNodeById(state.linkDrag.sourceId);
        if (sourceNode) {
          const sourcePoint = getPortPosition(sourceNode, state.linkDrag.port);
          lines.push(`<line x1="${sourcePoint.x}" y1="${sourcePoint.y}" x2="${state.linkDrag.pointerX}" y2="${state.linkDrag.pointerY}" stroke="#a04e1a" stroke-width="2" stroke-dasharray="6 5" opacity="0.95" />`);
        }
      }
      linkLayerEl.innerHTML = lines.join("");
    }

    function renderNodes(visibleIds) {
      const out = [];
      state.nodes.forEach(node => {
        if (!visibleIds.has(node.id)) return;
        const selected = state.selectedNodeIds.has(node.id) ? "selected" : "";
        const dropTarget = state.linkDrag && state.linkDrag.targetId === node.id ? "drop-target" : "";
        const parentPort = TYPE_ORDER.indexOf(node.type) > 0 ? `<div class="node-port node-port-top" data-port="parent" data-id="${node.id}" title="Lanka till parent"></div>` : "";
        const childPortClasses = ["node-port", "node-port-bottom"];
        const childPortTitle = hasChildren(node.id)
          ? (node.collapsed ? "Expandera eller dra for att lanka child" : "Kollapsa eller dra for att lanka child")
          : "Dra for att lanka child";
        if (hasChildren(node.id)) childPortClasses.push("has-children");
        if (node.collapsed) childPortClasses.push("is-collapsed");
        const childPort = nextType(node.type) ? `<div class="${childPortClasses.join(" ")}" data-port="child" data-id="${node.id}" title="${childPortTitle}"></div>` : "";
        const childType = nextType(node.type);
        const childPlus = childType ? `<button class="node-plus node-plus-child" data-act="child" data-id="${node.id}" title="Skapa child (${childType})">+</button>` : "";
        const sprintBadge = node.sprint ? `<span style="font-size: 10px; color: #7a3410; padding: 2px 4px; background: rgba(122, 52, 16, 0.15); border-radius: 3px; white-space: nowrap;">${escapeHtml(node.sprint)}</span>` : "";
        const rect = nodeRect(node);
        const resizeHandles = state.showTimeAxis
          ? `<div class="node-resize-handle start" data-resize-node-id="${node.id}" data-resize-side="start" title="Dra for att justera start"></div>
             <div class="node-resize-handle end" data-resize-node-id="${node.id}" data-resize-side="end" title="Dra for att justera slut"></div>`
          : "";

        out.push(`
          <div class="node ${typeClass(node.type)} ${selected} ${dropTarget}" data-node-id="${node.id}" style="left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;">
            ${parentPort}
            ${childPort}
            ${resizeHandles}
            <button class="node-plus node-plus-right" data-act="sibling" data-id="${node.id}" title="Skapa syskon (${node.type})">+</button>
            ${childPlus}
            <div class="node-head" data-drag-handle="1">
              <span>#${node.id}</span>
              <span class="node-type">${node.type}</span>
            </div>
            <div class="node-title" data-title-id="${node.id}" title="Double click to rename">${escapeHtml(node.title)}</div>
            ${sprintBadge ? `<div style="padding: 4px 8px; text-align: center;">${sprintBadge}</div>` : ""}
          </div>
        `);
      });
      nodeLayerEl.innerHTML = out.join("");
    }

    function renderBoard() {
      if (state.viewMode === "tree") applyTreeLayout();
      const visibleIds = visibleNodeIds();
      renderLinks(visibleIds);
      renderNodes(visibleIds);
      renderTimeline();
      bindNodeEvents();
      bindSprintChips();
      setTransform();
      updateSelectionInfo();
      updateUndoButton();
      updateViewToggle();
      updateTimelineToggle();
    }

    function clearSelectionUnlessToggle(toggle, nodeId) {
      if (toggle) return;
      state.selectedNodeIds = new Set([nodeId]);
    }

    function placeCaretAtEnd(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const selection = window.getSelection();
      if (!selection) return;
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function commitTitleEdit(nodeId, titleEl, originalTitle, shouldSave) {
      if (!state.titleEdit || state.titleEdit.nodeId !== nodeId) return;

      const node = getNodeById(nodeId);
      const nextRaw = titleEl ? String(titleEl.textContent || "") : "";
      const nextTitle = nextRaw.trim() || originalTitle;

      state.titleEdit = null;

      if (titleEl) {
        titleEl.classList.remove("editing");
        titleEl.removeAttribute("contenteditable");
      }

      if (!node) {
        renderBoard();
        return;
      }

      if (!shouldSave || nextTitle === node.title) {
        renderBoard();
        return;
      }

      recordHistory();
      node.title = nextTitle;
      renderBoard();
    }

    function beginTitleEdit(nodeId, titleEl) {
      const node = getNodeById(nodeId);
      if (!node || !titleEl) return;
      if (state.titleEdit && state.titleEdit.nodeId === nodeId) return;

      if (state.titleEdit) {
        const activeEl = nodeLayerEl.querySelector(`.node-title[data-title-id="${state.titleEdit.nodeId}"]`);
        if (activeEl) {
          commitTitleEdit(state.titleEdit.nodeId, activeEl, state.titleEdit.originalTitle, true);
        } else {
          state.titleEdit = null;
        }
      }

      const originalTitle = node.title;
      state.titleEdit = { nodeId, originalTitle };

      titleEl.classList.add("editing");
      titleEl.setAttribute("contenteditable", "true");
      titleEl.setAttribute("spellcheck", "false");
      titleEl.focus();
      placeCaretAtEnd(titleEl);

      titleEl.addEventListener("keydown", (e) => {
        if (!state.titleEdit || state.titleEdit.nodeId !== nodeId) return;
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          commitTitleEdit(nodeId, titleEl, originalTitle, true);
          return;
        }
        if (e.key === "Escape") {
          e.preventDefault();
          commitTitleEdit(nodeId, titleEl, originalTitle, false);
          return;
        }
        e.stopPropagation();
      });

      titleEl.addEventListener("blur", () => {
        commitTitleEdit(nodeId, titleEl, originalTitle, true);
      }, { once: true });
    }

    function bindSprintChips() {
      document.querySelectorAll(".sprint-chip").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          if (state.selectedNodeIds.size === 0) return;
          const sprintValue = btn.getAttribute("data-sprint");
          recordHistory();
          state.selectedNodeIds.forEach(nodeId => {
            const node = getNodeById(nodeId);
            if (node) node.sprint = sprintValue;
          });
          renderBoard();
        });
      });
    }

    function bindNodeEvents() {
      nodeLayerEl.querySelectorAll(".node").forEach(el => {
        const nodeId = Number(el.getAttribute("data-node-id"));
        if (!Number.isFinite(nodeId)) return;

        el.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          const target = e.target;
          if (target.closest("button") || target.closest("[data-port]") || target.closest("[data-resize-side]")) return;

          const toggle = e.ctrlKey || e.metaKey;
          if (toggle) {
            if (state.selectedNodeIds.has(nodeId)) state.selectedNodeIds.delete(nodeId);
            else state.selectedNodeIds.add(nodeId);
          } else {
            if (!state.selectedNodeIds.has(nodeId)) {
              state.selectedNodeIds = new Set([nodeId]);
            }
          }

          if (state.viewMode === "tree") {
            e.preventDefault();
            renderBoard();
            return;
          }

          const movingIds = state.selectedNodeIds.has(nodeId)
            ? Array.from(state.selectedNodeIds)
            : [nodeId];

          state.dragNodeId = nodeId;
          state.dragStartPointer = { x: e.clientX, y: e.clientY };
          state.dragNodeStart = new Map();
          state.dragSnapshot = createHistorySnapshot();
          state.dragDidMove = false;
          movingIds.forEach(id => {
            const n = getNodeById(id);
            if (n) state.dragNodeStart.set(id, { x: n.x, y: n.y });
          });

          e.preventDefault();
          renderBoard();
        });

        const titleEl = el.querySelector(".node-title");
        if (titleEl) {
          titleEl.addEventListener("pointerdown", (e) => {
            e.stopPropagation();
          });

          titleEl.addEventListener("dblclick", (e) => {
            e.stopPropagation();
            beginTitleEdit(nodeId, titleEl);
          });
        }
      });

      nodeLayerEl.querySelectorAll("[data-resize-side]").forEach(handleEl => {
        handleEl.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          if (!state.showTimeAxis) return;

          const nodeId = Number(handleEl.getAttribute("data-resize-node-id"));
          const side = handleEl.getAttribute("data-resize-side");
          const node = getNodeById(nodeId);
          if (!node || (side !== "start" && side !== "end")) return;

          const range = getNodeTimeRange(node);
          const rect = nodeRect(node);
          const timeRect = timeAxisEl.getBoundingClientRect();
          const trackLeft = timeRect.left + 12;
          const trackRight = timeRect.right - 12;
          const trackWidth = Math.max(1, trackRight - trackLeft);
          const pointerRatio = clamp01((e.clientX - trackLeft) / trackWidth);
          const handleRatio = side === "start" ? range.startRatio : range.endRatio;

          node.timeStartDate = formatDateISO(new Date(range.startMs));
          node.timeEndDate = formatDateISO(new Date(range.endMs));
          state.nodeRangeDrag = {
            nodeId,
            side,
            anchorLeftX: rect.x,
            anchorRightX: rect.x + rect.w,
            dragOffsetRatio: pointerRatio - handleRatio,
            didMove: false,
            snapshot: createHistorySnapshot(),
          };
          e.preventDefault();
        });
      });

      nodeLayerEl.querySelectorAll("[data-port]").forEach(portEl => {
        portEl.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          e.stopPropagation();
          const sourceId = Number(portEl.getAttribute("data-id"));
          const port = portEl.getAttribute("data-port");
          const sourceNode = getNodeById(sourceId);
          if (!sourceNode || !port) return;
          const boardPoint = screenToBoard(e.clientX, e.clientY);
          state.linkDrag = {
            sourceId,
            port,
            pointerX: boardPoint.x,
            pointerY: boardPoint.y,
            targetId: null,
            startX: e.clientX,
            startY: e.clientY,
            didMove: false,
          };
          state.linkSnapshot = createHistorySnapshot();
          renderBoard();
          e.preventDefault();
        });
      });

      nodeLayerEl.querySelectorAll("button[data-act]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = Number(btn.getAttribute("data-id"));
          const act = btn.getAttribute("data-act");
          const node = getNodeById(id);
          if (!node) return;

          if (act === "sibling") createSiblingNode(node);
          else if (act === "child") createChildNode(node);
          else if (act === "delete") deleteNodes(new Set([node.id]));
          else if (act === "reparent") {
            openReparent(node);
          }
        });
      });
    }

    function updateSelectionRectVisual() {
      if (!state.selectionRect) {
        selectionRectEl.style.display = "none";
        return;
      }

      const r = state.selectionRect;
      const viewportRect = viewportEl.getBoundingClientRect();
      const offsetX = viewportRect.left;
      const offsetY = viewportRect.top;

      const x = Math.min(r.x1, r.x2) - offsetX;
      const y = Math.min(r.y1, r.y2) - offsetY;
      const w = Math.abs(r.x2 - r.x1);
      const h = Math.abs(r.y2 - r.y1);

      selectionRectEl.style.display = "block";
      selectionRectEl.style.left = `${x}px`;
      selectionRectEl.style.top = `${y}px`;
      selectionRectEl.style.width = `${w}px`;
      selectionRectEl.style.height = `${h}px`;
    }

    function marqueePick() {
      if (!state.selectionRect) return;
      const sx1 = Math.min(state.selectionRect.x1, state.selectionRect.x2);
      const sy1 = Math.min(state.selectionRect.y1, state.selectionRect.y2);
      const sx2 = Math.max(state.selectionRect.x1, state.selectionRect.x2);
      const sy2 = Math.max(state.selectionRect.y1, state.selectionRect.y2);

      const b1 = screenToBoard(sx1, sy1);
      const b2 = screenToBoard(sx2, sy2);
      const x1 = Math.min(b1.x, b2.x);
      const y1 = Math.min(b1.y, b2.y);
      const x2 = Math.max(b1.x, b2.x);
      const y2 = Math.max(b1.y, b2.y);

      const visibleIds = visibleNodeIds();
      const next = new Set();
      state.nodes.forEach(node => {
        if (!visibleIds.has(node.id)) return;
        const r = nodeRect(node);
        const hit = r.x < x2 && (r.x + r.w) > x1 && r.y < y2 && (r.y + r.h) > y1;
        if (hit) next.add(node.id);
      });

      const nextMilestones = new Set();
      state.milestones.forEach(milestone => {
        const screenX = boardToScreen(getMilestoneBoardX(milestone), 0).x;
        if (screenX >= sx1 && screenX <= sx2) nextMilestones.add(milestone.id);
      });

      const nextYMilestones = new Set();
      state.yMilestones.forEach(milestone => {
        const screenY = boardToScreen(0, getYMilestoneBoardY(milestone)).y;
        if (screenY >= sy1 && screenY <= sy2) nextYMilestones.add(milestone.id);
      });

      state.selectedNodeIds = next;
      state.selectedMilestoneIds = nextMilestones;
      state.selectedYMilestoneIds = nextYMilestones;
      updateSelectionInfo();
    }

    viewportEl.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      const onNode = e.target.closest(".node");
      if (onNode) return;

      const onBackground = e.target === viewportEl || e.target === stageEl || e.target === linkLayerEl || e.target === nodeLayerEl;
      if (!onBackground) return;

      if (e.ctrlKey || e.metaKey) {
        state.isZooming = true;
        state.zoomStart = {
          x: e.clientX,
          y: e.clientY,
          zoom: state.zoom,
          bx: (e.clientX - state.panX) / state.zoom,
          by: (e.clientY - state.panY) / state.zoom,
        };
        viewportEl.classList.add("zooming");
      } else if (e.shiftKey) {
        state.isPanning = true;
        state.panStart = { x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY };
        viewportEl.classList.add("panning");
      } else {
        state.isSelecting = true;
        state.selectionRect = { x1: e.clientX, y1: e.clientY, x2: e.clientX, y2: e.clientY };
        updateSelectionRectVisual();
        state.selectedNodeIds = new Set();
        state.selectedMilestoneIds = new Set();
        state.selectedYMilestoneIds = new Set();
        updateSelectionInfo();
      }
      e.preventDefault();
    });

    viewportEl.addEventListener("wheel", (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();

        const before = screenToBoard(e.clientX, e.clientY);
        const nextZoom = clampZoom(state.zoom * Math.exp(-e.deltaY * 0.0015));
        if (nextZoom === state.zoom) return;

        const viewportRect = viewportEl.getBoundingClientRect();
        state.zoom = nextZoom;
        state.panX = e.clientX - viewportRect.left - before.x * nextZoom;
        state.panY = e.clientY - viewportRect.top - before.y * nextZoom;
        renderBoard();
        return;
      }

      e.preventDefault();
      state.panX -= e.deltaX;
      state.panY -= e.deltaY;
      setTransform();
    }, { passive: false });

    window.addEventListener("pointermove", (e) => {
      if (state.nodeRangeDrag) {
        const node = getNodeById(state.nodeRangeDrag.nodeId);
        if (!node) return;

        const timeRect = timeAxisEl.getBoundingClientRect();
        const trackLeft = timeRect.left + 12;
        const trackRight = timeRect.right - 12;
        const trackWidth = Math.max(1, trackRight - trackLeft);
        const pointerRatio = (e.clientX - trackLeft) / trackWidth;
        const ratio = clamp01(pointerRatio - (state.nodeRangeDrag.dragOffsetRatio || 0));
        const { startMs, endMs } = getTimelineBoundsMs();
        const dayMs = 24 * 60 * 60 * 1000;
        const minGapMs = dayMs;
        const rawMs = ratioToMs(ratio, startMs, endMs);
        const snappedMs = Math.round(rawMs / dayMs) * dayMs;

        const range = getNodeTimeRange(node);
        if (state.nodeRangeDrag.side === "start") {
          const nextStart = Math.min(snappedMs, range.endMs - minGapMs);
          node.timeStartDate = formatDateISO(new Date(nextStart));
          const dur = Math.max(dayMs, range.endMs - nextStart);
          node.boardWidth = computeBoardWidth(dur) ?? node.boardWidth;
          node.x = state.nodeRangeDrag.anchorRightX - getNodeWidth(node);
          if (!node.timeEndDate) node.timeEndDate = formatDateISO(new Date(range.endMs));
        } else {
          const nextEnd = Math.max(snappedMs, range.startMs + minGapMs);
          const dur = Math.max(dayMs, nextEnd - range.startMs);
          node.boardWidth = computeBoardWidth(dur) ?? node.boardWidth;
          node.x = state.nodeRangeDrag.anchorLeftX;
          node.timeEndDate = formatDateISO(new Date(nextEnd));
          if (!node.timeStartDate) node.timeStartDate = formatDateISO(new Date(range.startMs));
        }

        state.nodeRangeDrag.didMove = true;
        renderBoard();
        return;
      }

      if (state.timelineDrag) {
        const item = state.milestones.find(m => m.id === state.timelineDrag.id);
        if (!item) return;
        const moved = Math.abs(e.clientX - state.timelineDrag.startClientX);
        const boardPoint = screenToBoard(e.clientX, viewportEl.getBoundingClientRect().top + (viewportEl.clientHeight / 2));
        if (Math.abs(boardPoint.x - getMilestoneBoardX(item)) > 0.01) {
          item.boardX = boardPoint.x;
          state.timelineDrag.didMove = true;
          renderBoard();
        } else if (moved > 2) {
          state.timelineDrag.didMove = true;
        }
        return;
      }

      if (state.yAxisDrag) {
        const item = state.yMilestones.find(m => m.id === state.yAxisDrag.id);
        if (!item) return;
        const moved = Math.abs(e.clientY - state.yAxisDrag.startClientY);
        const boardPoint = screenToBoard(viewportEl.getBoundingClientRect().left + (viewportEl.clientWidth / 2), e.clientY);
        if (Math.abs(boardPoint.y - getYMilestoneBoardY(item)) > 0.01) {
          item.boardY = boardPoint.y;
          state.yAxisDrag.didMove = true;
          renderBoard();
        } else if (moved > 2) {
          state.yAxisDrag.didMove = true;
        }
        return;
      }

      if (state.linkDrag) {
        const sourceNode = getNodeById(state.linkDrag.sourceId);
        const boardPoint = screenToBoard(e.clientX, e.clientY);
        state.linkDrag.pointerX = boardPoint.x;
        state.linkDrag.pointerY = boardPoint.y;
        if (!state.linkDrag.didMove) {
          const movedX = e.clientX - state.linkDrag.startX;
          const movedY = e.clientY - state.linkDrag.startY;
          if ((movedX * movedX) + (movedY * movedY) > 16) state.linkDrag.didMove = true;
        }
        const targetNode = sourceNode ? findLinkTargetCandidate(sourceNode, state.linkDrag.port, boardPoint.x, boardPoint.y) : null;
        state.linkDrag.targetId = targetNode ? targetNode.id : null;
        renderBoard();
        return;
      }

      if (state.dragStartPointer && state.dragNodeStart.size) {
        const dx = (e.clientX - state.dragStartPointer.x) / state.zoom;
        const dy = (e.clientY - state.dragStartPointer.y) / state.zoom;
        if (!state.dragDidMove && ((dx * dx) + (dy * dy) > 4)) state.dragDidMove = true;
        state.dragNodeStart.forEach((start, id) => {
          const n = getNodeById(id);
          if (!n) return;
          n.x = start.x + dx;
          n.y = start.y + dy;
          syncNodeDatesFromLayout(n);
        });
        renderBoard();
        return;
      }

      if (state.isZooming && state.zoomStart) {
        const nextZoom = clampZoom(state.zoomStart.zoom + (state.zoomStart.y - e.clientY) * 0.005);
        state.zoom = nextZoom;
        state.panX = state.zoomStart.x - state.zoomStart.bx * nextZoom;
        state.panY = state.zoomStart.y - state.zoomStart.by * nextZoom;
        renderBoard();
        return;
      }

      if (state.isPanning && state.panStart) {
        state.panX = state.panStart.panX + (e.clientX - state.panStart.x);
        state.panY = state.panStart.panY + (e.clientY - state.panStart.y);
        setTransform();
        return;
      }

      if (state.isSelecting && state.selectionRect) {
        state.selectionRect.x2 = e.clientX;
        state.selectionRect.y2 = e.clientY;
        updateSelectionRectVisual();
        marqueePick();
        renderBoard();
      }
    });

    window.addEventListener("pointerup", () => {
      const shouldRender = state.dragNodeId != null || state.linkDrag != null || state.isSelecting || state.timelineDrag != null || state.yAxisDrag != null || state.nodeRangeDrag != null;

      if (state.nodeRangeDrag && state.nodeRangeDrag.didMove) {
        pushHistorySnapshot(state.nodeRangeDrag.snapshot);
      }

      if (state.timelineDrag) {
        if (state.timelineDrag.didMove) {
          pushHistorySnapshot(state.timelineDrag.snapshot);
          state.selectedMilestoneIds = new Set([state.timelineDrag.id]);
        } else {
          const id = state.timelineDrag.id;
          if (state.timelineDrag.toggle) {
