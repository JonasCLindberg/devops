            if (state.selectedMilestoneIds.has(id)) state.selectedMilestoneIds.delete(id);
            else state.selectedMilestoneIds.add(id);
          } else {
            state.selectedMilestoneIds = new Set([id]);
            state.selectedNodeIds = new Set();
          }
        }
      }

      if (state.yAxisDrag) {
        if (state.yAxisDrag.didMove) {
          pushHistorySnapshot(state.yAxisDrag.snapshot);
          state.selectedYMilestoneIds = new Set([state.yAxisDrag.id]);
        } else {
          const id = state.yAxisDrag.id;
          if (state.yAxisDrag.toggle) {
            if (state.selectedYMilestoneIds.has(id)) state.selectedYMilestoneIds.delete(id);
            else state.selectedYMilestoneIds.add(id);
          } else {
            state.selectedYMilestoneIds = new Set([id]);
            state.selectedNodeIds = new Set();
          }
        }
      }

      if (state.linkDrag) {
        const sourceNode = getNodeById(state.linkDrag.sourceId);
        const targetNode = state.linkDrag.targetId != null ? getNodeById(state.linkDrag.targetId) : null;
        if (sourceNode && !state.linkDrag.didMove && state.linkDrag.port === "child" && hasChildren(sourceNode.id)) {
          pushHistorySnapshot(state.linkSnapshot);
          sourceNode.collapsed = !sourceNode.collapsed;
        } else if (sourceNode && targetNode && canLinkWithPort(sourceNode, state.linkDrag.port, targetNode)) {
          pushHistorySnapshot(state.linkSnapshot);
          if (state.linkDrag.port === "child") {
            if (state.viewMode === "tree" && state.freeLayoutPositions) {
              const oldPos = getFreePosition(targetNode);
              const nextPos = findBestChildPosition(sourceNode, targetNode.id);
              targetNode.parentId = sourceNode.id;
              shiftSubtreeFreeLayout(targetNode.id, nextPos.x - oldPos.x, nextPos.y - oldPos.y);
            } else {
              targetNode.parentId = sourceNode.id;
            }
            sourceNode.collapsed = false;
          } else {
            if (state.viewMode === "tree" && state.freeLayoutPositions) {
              const oldPos = getFreePosition(sourceNode);
              const nextPos = findBestChildPosition(targetNode, sourceNode.id);
              sourceNode.parentId = targetNode.id;
              shiftSubtreeFreeLayout(sourceNode.id, nextPos.x - oldPos.x, nextPos.y - oldPos.y);
            } else {
              sourceNode.parentId = targetNode.id;
            }
            targetNode.collapsed = false;
          }
        }
      }

      if (state.dragDidMove && state.dragSnapshot) {
        pushHistorySnapshot(state.dragSnapshot);
      }

      state.dragNodeId = null;
      state.dragStartPointer = null;
      state.dragNodeStart = new Map();
      state.dragSnapshot = null;
      state.dragDidMove = false;
      state.linkDrag = null;
      state.linkSnapshot = null;
      state.timelineDrag = null;
      state.yAxisDrag = null;
      state.nodeRangeDrag = null;

      if (state.isZooming) {
        state.isZooming = false;
        state.zoomStart = null;
        viewportEl.classList.remove("zooming");
      }

      if (state.isPanning) {
        state.isPanning = false;
        state.panStart = null;
        viewportEl.classList.remove("panning");
      }

      if (state.isSelecting) {
        state.isSelecting = false;
        state.selectionRect = null;
        updateSelectionRectVisual();
      }

      if (shouldRender) renderBoard();
    });

    function handleGlobalKeydown(e) {
      const target = e.target;
      const tag = target && target.tagName ? String(target.tagName).toUpperCase() : "";
      const inputType = target && target.type ? String(target.type).toLowerCase() : "";
      const isTextInput = tag === "INPUT" && /^(text|search|url|tel|email|password|number|date|datetime-local|month|week|time)$/.test(inputType || "text");
      const isTextArea = tag === "TEXTAREA";
      const isContentEditable = Boolean(target && target.isContentEditable);
      if (isTextInput || isTextArea || isContentEditable) return;

      const key = String(e.key || "").toLowerCase();
      const code = String(e.code || "").toLowerCase();
      const isUndoKey = (e.metaKey || e.ctrlKey) && !e.shiftKey && (key === "z" || code === "keyz");
      if (isUndoKey) {
        e.preventDefault();
        undo();
        return;
      }

      const isDeleteKey = e.key === "Delete" || e.key === "Backspace";
      if (!isDeleteKey) return;
      if (!state.selectedNodeIds.size && !state.selectedMilestoneIds.size && !state.selectedYMilestoneIds.size) return;
      e.preventDefault();
      if (state.selectedNodeIds.size) {
        deleteNodes(new Set(state.selectedNodeIds));
        if (state.selectedMilestoneIds.size) {
          deleteMilestones(new Set(state.selectedMilestoneIds), { record: false, render: true });
        }
        if (state.selectedYMilestoneIds.size) {
          deleteYMilestones(new Set(state.selectedYMilestoneIds), { record: false, render: true });
        }
      } else if (state.selectedMilestoneIds.size && state.selectedYMilestoneIds.size) {
        deleteMilestones(new Set(state.selectedMilestoneIds));
        deleteYMilestones(new Set(state.selectedYMilestoneIds), { record: false, render: true });
      } else {
        if (state.selectedMilestoneIds.size) deleteMilestones(new Set(state.selectedMilestoneIds));
        else deleteYMilestones(new Set(state.selectedYMilestoneIds));
      }
    }

    window.addEventListener("keydown", handleGlobalKeydown, { capture: true });

    undoBtnEl.addEventListener("click", () => undo());

    viewTreeToggleEl.addEventListener("change", () => {
      const nextMode = viewTreeToggleEl.checked ? "tree" : "free";
      if (state.viewMode === nextMode) return;

      if (nextMode === "tree") {
        captureFreeLayoutPositions();
      } else {
        restoreFreeLayoutPositions();
      }

      state.viewMode = nextMode;
      renderBoard();
    });

    showTimelineToggleEl.addEventListener("change", () => {
      const next = showTimelineToggleEl.checked;
      if (state.showTimeline === next) return;
      recordHistory();
      state.showTimeline = next;
      renderBoard();
    });

    showTimeAxisToggleEl.addEventListener("change", () => {
      const next = showTimeAxisToggleEl.checked;
      if (state.showTimeAxis === next) return;
      recordHistory();
      state.showTimeAxis = next;
      if (next) {
        renderBoard();
        state.nodes.forEach(node => syncNodeXFromDates(node));
      }
      renderBoard();
    });

    showYAxisToggleEl.addEventListener("change", () => {
      const next = showYAxisToggleEl.checked;
      if (state.showYAxis === next) return;
      recordHistory();
      state.showYAxis = next;
      renderBoard();
    });

    timelineAxisEl.addEventListener("click", (e) => {
      if (!state.showTimeline) return;
      if (e.target.closest(".timeline-marker")) return;
      const boardPoint = screenToBoard(e.clientX, viewportEl.getBoundingClientRect().top + (viewportEl.clientHeight / 2));
      recordHistory();
      const id = state.milestoneSeq++;
      state.milestones.push({
        id,
        boardX: boardPoint.x,
        text: "milstolpe",
      });
      state.selectedMilestoneIds = new Set([id]);
      state.selectedNodeIds = new Set();
      renderBoard();
    });

    function askForTimelineDate(side) {
      const current = side === "start" ? (state.timelineStartDate || "") : (state.timelineEndDate || "");
      const label = side === "start" ? "Ange startdatum (YYYY-MM-DD)" : "Ange slutdatum (YYYY-MM-DD)";
      const value = prompt(label, current);
      if (value == null) return;
      const trimmed = value.trim();

      if (!trimmed) {
        if (side === "start") state.timelineStartDate = null;
        else state.timelineEndDate = null;
        renderTimeline();
        return;
      }

      const isoDate = /^\d{4}-\d{2}-\d{2}$/;
      if (!isoDate.test(trimmed) || Number.isNaN(new Date(trimmed).getTime())) {
        alert("Ogiltigt datum. Anvand formatet YYYY-MM-DD.");
        return;
      }

      if (side === "start") state.timelineStartDate = trimmed;
      else state.timelineEndDate = trimmed;

      if (state.timelineStartDate && state.timelineEndDate && state.timelineStartDate > state.timelineEndDate) {
        const swap = state.timelineStartDate;
        state.timelineStartDate = state.timelineEndDate;
        state.timelineEndDate = swap;
      }

      renderTimeline();
    }

    timeAxisStartHandleEl.addEventListener("click", (e) => {
      e.stopPropagation();
      askForTimelineDate("start");
    });

    timeAxisEndHandleEl.addEventListener("click", (e) => {
      e.stopPropagation();
      askForTimelineDate("end");
    });

    yAxisEl.addEventListener("click", (e) => {
      if (!state.showYAxis) return;
      if (e.target.closest(".yaxis-marker")) return;
      const boardPoint = screenToBoard(viewportEl.getBoundingClientRect().left + (viewportEl.clientWidth / 2), e.clientY);
      recordHistory();
      const id = state.yMilestoneSeq++;
      state.yMilestones.push({
        id,
        boardY: boardPoint.y,
        text: "milstolpe",
      });
      state.selectedYMilestoneIds = new Set([id]);
      state.selectedNodeIds = new Set();
      renderBoard();
    });

    setAsViewBtnEl.addEventListener("click", () => {
      setCurrentViewAsFreeLayout();
    });

    document.getElementById("fitBtn").addEventListener("click", () => {
      if (!state.nodes.length) {
        state.panX = 0;
        state.panY = 0;
        state.zoom = 1;
        renderBoard();
        return;
      }

      const visibleIds = visibleNodeIds();
      const visible = state.nodes.filter(n => visibleIds.has(n.id));
      if (!visible.length) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      visible.forEach(node => {
        const r = nodeRect(node);
        minX = Math.min(minX, r.x);
        minY = Math.min(minY, r.y);
        maxX = Math.max(maxX, r.x + r.w);
        maxY = Math.max(maxY, r.y + r.h);
      });

      const pad = 60;
      const boundsW = Math.max(100, maxX - minX + pad * 2);
      const boundsH = Math.max(100, maxY - minY + pad * 2);
      const vw = viewportEl.clientWidth;
      const vh = viewportEl.clientHeight;
      const z = clampZoom(Math.min(vw / boundsW, vh / boundsH));

      state.zoom = z;
      state.panX = (vw - (maxX - minX) * z) / 2 - minX * z;
      state.panY = (vh - (maxY - minY) * z) / 2 - minY * z;
      renderBoard();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm("Clear all nodes?")) return;
      if (!state.nodes.length) return;
      recordHistory();
      state.nodes = [];
      state.selectedNodeIds = new Set();
      renderBoard();
    });

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Host integration API
    window.breakdownSpikeExportState = function breakdownSpikeExportState() {
      return createHistorySnapshot();
    };

    window.breakdownSpikeImportState = function breakdownSpikeImportState(snapshot) {
      if (!snapshot || typeof snapshot !== "object") return false;
      try {
        restoreHistorySnapshot(snapshot);
        return true;
      } catch (_err) {
        return false;
      }
    };

    window.breakdownSpikeCreateNodeFromWorkItem = function breakdownSpikeCreateNodeFromWorkItem(workItem) {
      if (!workItem || typeof workItem !== "object") return false;
      const title = String(workItem.title || "").trim() || "New Item";
      const rawType = String(workItem.type || "").trim();
      const mappedType = rawType === "Epic" || rawType === "Feature" || rawType === "Story" || rawType === "Task"
        ? rawType
        : "Task";
      const issueId = Number(workItem.id) || Math.floor(Math.random() * 1000000);

      const viewportRect = viewportEl.getBoundingClientRect();
      const center = screenToBoard(
        viewportRect.left + viewportEl.clientWidth / 2,
        viewportRect.top + viewportEl.clientHeight / 2,
      );

      recordHistory();
      const node = createNodeFromIssue({ id: issueId, title, type: mappedType }, center.x, center.y);
      state.selectedNodeIds = new Set([node.id]);
      renderBoard();
      return true;
    };

    window.breakdownSpikeRunCommand = function breakdownSpikeRunCommand(command, value) {
      const cmd = String(command || "").trim();
      if (!cmd) return false;

      if (cmd === "undo") {
        undo();
        return true;
      }

      if (cmd === "fit") {
        if (!state.nodes.length) {
          state.panX = 0;
          state.panY = 0;
          state.zoom = 1;
          renderBoard();
          return true;
        }

        const visibleIds = visibleNodeIds();
        const visible = state.nodes.filter(n => visibleIds.has(n.id));
        if (!visible.length) return true;

        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        visible.forEach(node => {
          const r = nodeRect(node);
          minX = Math.min(minX, r.x);
          minY = Math.min(minY, r.y);
          maxX = Math.max(maxX, r.x + r.w);
          maxY = Math.max(maxY, r.y + r.h);
        });

        const pad = 60;
        const boundsW = Math.max(100, maxX - minX + pad * 2);
        const boundsH = Math.max(100, maxY - minY + pad * 2);
        const vw = viewportEl.clientWidth;
        const vh = viewportEl.clientHeight;
        const z = clampZoom(Math.min(vw / boundsW, vh / boundsH));
        state.zoom = z;
        state.panX = (vw - (maxX - minX) * z) / 2 - minX * z;
        state.panY = (vh - (maxY - minY) * z) / 2 - minY * z;
        renderBoard();
        return true;
      }

      if (cmd === "clear") {
        recordHistory();
        state.nodes = [];
        state.selectedNodeIds = new Set();
        renderBoard();
        return true;
      }

      if (cmd === "toggleTimeAxis") {
        state.showTimeAxis = Boolean(value);
        renderBoard();
        return true;
      }

      return false;
    };

    (function init() {
      setTransform();
      updateSelectionInfo();
    })();
  </script>
</body>
</html>
